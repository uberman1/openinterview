<!DOCTYPE html>
<html lang="en"><head>

<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reset Password - OpenInterview.me</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#141414",
                        "background-light": "#f7f7f7",
                        "background-dark": "#191919",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <link rel="icon" type="image/png" href="/favicon.png" />
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-primary dark:text-background-light">
<div class="flex flex-col min-h-screen">
    <div class="w-full pt-8 pl-8">
        <a href="/" class="inline-flex items-center gap-2 text-sm text-primary/70 hover:text-primary dark:text-background-light/70 dark:hover:text-background-light transition-colors">
            <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            Back to Home
        </a>
    </div>
<main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
<div class="w-full max-w-md space-y-8">
<div>
<h1 class="text-center text-3xl font-extrabold tracking-tight">
                        Reset Password
                    </h1>
</div>
<div class="bg-background-light dark:bg-background-dark p-8 border border-primary/10 dark:border-background-light/10 rounded-lg shadow-sm space-y-6">
<form action="#" class="space-y-6" method="POST">
<div>
<label class="sr-only" for="current-password">Current Password</label>
<input class="appearance-none block w-full px-4 py-3 border border-primary/20 dark:border-background-light/20 rounded-lg placeholder-primary/50 dark:placeholder-background-light/50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark focus:ring-primary/50 bg-transparent text-sm" id="current-password" name="current-password" placeholder="Current Password" required="" type="password"/>
</div>
<div>
<label class="sr-only" for="new-password">New Password</label>
<input class="appearance-none block w-full px-4 py-3 border border-primary/20 dark:border-background-light/20 rounded-lg placeholder-primary/50 dark:placeholder-background-light/50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark focus:ring-primary/50 bg-transparent text-sm" id="new-password" name="new-password" placeholder="New Password" required="" type="password"/>
</div>
<div>
<label class="sr-only" for="confirm-new-password">Confirm New Password</label>
<input class="appearance-none block w-full px-4 py-3 border border-primary/20 dark:border-background-light/20 rounded-lg placeholder-primary/50 dark:placeholder-background-light/50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark focus:ring-primary/50 bg-transparent text-sm" id="confirm-new-password" name="confirm-new-password" placeholder="Confirm New Password" required="" type="password"/>
</div>
<div>
<button id="reset-btn" class="cursor-pointer group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-lg text-background-light bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark focus:ring-primary/50 transition-colors disabled:opacity-70 disabled:cursor-not-allowed items-center gap-2" type="submit">
                                <span>Update Password</span>
                                <span class="material-symbols-outlined text-[18px] hidden animate-spin">refresh</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        <footer class="w-full py-8 border-t border-primary/10 dark:border-background-light/10 mt-auto">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-primary/50 dark:text-background-light/50">
                <p>© 2024 OpenInterview.me. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const btn = document.getElementById('reset-btn');
            const spinner = btn.querySelector('.animate-spin');
            const text = btn.querySelector('span:first-child');
            
            if (btn.disabled) {
                e.preventDefault();
                return;
            }

            btn.disabled = true;
            text.textContent = 'Updating...';
            if (spinner) spinner.classList.remove('hidden');
            
            // Allow the form to submit naturally since it's a POST
        });

        // Reset state if user navigates back
        window.addEventListener('pageshow', () => {
            const btn = document.getElementById('reset-btn');
            const spinner = btn.querySelector('.animate-spin');
            const text = btn.querySelector('span:first-child');
            
            if (btn) {
                btn.disabled = false;
                text.textContent = 'Update Password';
                if (spinner) spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
