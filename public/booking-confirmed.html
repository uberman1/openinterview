<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Booking Confirmed - OpenInterview.me</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#141414",
            "background-light": "#f7f7f7",
            "background-dark": "#191919",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          }
        },
      },
    }
  </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-primary dark:text-neutral-50 min-h-screen flex items-center justify-center p-4">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[9999] focus:px-4 focus:py-2 focus:bg-primary focus:text-white focus:rounded-lg focus:shadow-lg focus:outline-none">Skip to main content</a>
  <main id="main-content" class="w-full max-w-md text-center" aria-label="Booking confirmation">
    <!-- Success Icon -->
    <div class="w-20 h-20 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center mx-auto mb-6" aria-hidden="true">
      <span class="material-symbols-outlined text-5xl text-green-600">event_available</span>
    </div>
    
    <!-- Title -->
    <h1 class="text-3xl font-bold mb-4">Booking Confirmed!</h1>
    
    <!-- Description -->
    <p class="text-neutral-600 dark:text-neutral-400 mb-8">
      Your interview has been scheduled. A calendar invite has been generated for you.
    </p>
    
    <!-- Booking Details -->
    <section id="booking-details" class="bg-white dark:bg-neutral-800 rounded-lg p-6 mb-8 border border-neutral-200 dark:border-neutral-700 text-left" aria-label="Booking details">
      <div class="flex items-center gap-3 mb-4 pb-4 border-b border-neutral-200 dark:border-neutral-700">
        <div class="w-12 h-12 bg-primary dark:bg-white rounded-full flex items-center justify-center" aria-hidden="true">
          <span class="material-symbols-outlined text-white dark:text-primary">person</span>
        </div>
        <div>
          <p id="profile-name" class="font-bold">Loading...</p>
          <p id="profile-title" class="text-sm text-neutral-500">-</p>
        </div>
      </div>
      
      <div class="space-y-3">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-neutral-400" aria-hidden="true">calendar_today</span>
          <span id="booking-date">-</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-neutral-400" aria-hidden="true">schedule</span>
          <span id="booking-time">-</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-neutral-400" aria-hidden="true">timer</span>
          <span id="booking-duration">-</span>
        </div>
      </div>
    </section>
    
    <!-- Download ICS Button -->
    <a id="download-ics-btn" href="#" 
      class="inline-flex items-center justify-center gap-2 h-12 px-8 bg-primary text-white font-bold rounded-lg hover:opacity-90 transition-opacity mb-4 w-full"
      aria-label="Download calendar invite (.ics file)">
      <span class="material-symbols-outlined" aria-hidden="true">download</span>
      Download Calendar Invite
    </a>
    
    <!-- Add to Calendar Options -->
    <div class="flex gap-3 justify-center mb-8" role="group" aria-label="Add to calendar">
      <a id="google-cal-btn" href="#" target="_blank"
        class="flex items-center gap-2 px-4 py-2 border border-neutral-300 dark:border-neutral-600 rounded-lg text-sm hover:bg-neutral-100 dark:hover:bg-neutral-700 transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google Calendar
      </a>
      <a id="outlook-cal-btn" href="#" target="_blank"
        class="flex items-center gap-2 px-4 py-2 border border-neutral-300 dark:border-neutral-600 rounded-lg text-sm hover:bg-neutral-100 dark:hover:bg-neutral-700 transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="#0078D4" aria-hidden="true">
          <path d="M7.88 12.04q0 .45-.11.87-.1.41-.33.74-.22.33-.58.52-.37.2-.87.2t-.85-.2q-.35-.21-.57-.55-.22-.33-.33-.75-.1-.42-.1-.86t.1-.87q.1-.43.34-.76.22-.34.59-.54.36-.2.87-.2t.86.2q.35.21.57.55.22.34.31.77.1.43.1.88zM24 12v9.38q0 .46-.33.8-.33.32-.8.32H7.13q-.46 0-.8-.33-.32-.33-.32-.8V18H1q-.41 0-.7-.3-.3-.29-.3-.7V7q0-.41.3-.7Q.58 6 1 6h6.5V2.55q0-.44.3-.75.3-.3.75-.3h12.9q.44 0 .75.3.3.3.3.75V12zm-6-8.25v3h3v-3zm0 4.5v3h3v-3zm0 4.5v1.83l3.05-1.83zm-5.25-9v3h3.75v-3zm0 4.5v3h3.75v-3zm0 4.5v2.03l2.41 1.5 1.34-.8v-2.73zM9 3.75V6h2l.13.01.12.04v-2.3zM5.98 15.98q.9 0 1.6-.3.7-.32 1.19-.86.48-.55.73-1.28.25-.74.25-1.61 0-.83-.25-1.55-.24-.71-.71-1.24t-1.15-.83q-.68-.3-1.55-.3-.92 0-1.64.3-.71.3-1.2.85-.5.54-.75 1.3-.25.74-.25 1.63 0 .85.26 1.56.26.72.74 1.23.48.52 1.17.81.69.3 1.56.3zM7.5 21h12.39L12 16.08V17q0 .41-.3.7-.29.3-.7.3H7.5zm15-.13v-7.24l-5.9 3.54Z"/>
        </svg>
        Outlook
      </a>
    </div>
    
    <!-- Back Link -->
    <p>
      <a href="/" class="text-neutral-500 hover:text-primary dark:hover:text-white text-sm">
        ← Back to OpenInterview.me
      </a>
    </p>
  </main>
  
  <script>
    // Get booking ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const bookingId = urlParams.get('id');
    const profileName = urlParams.get('name') || 'Candidate';
    const profileTitle = urlParams.get('title') || '';
    const date = urlParams.get('date');
    const time = urlParams.get('time');
    const duration = urlParams.get('duration') || '30';
    
    // Populate details
    document.getElementById('profile-name').textContent = profileName;
    document.getElementById('profile-title').textContent = profileTitle;
    
    if (date) {
      const dateObj = new Date(date + 'T00:00:00');
      document.getElementById('booking-date').textContent = dateObj.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }
    
    if (time) {
      const [hours, minutes] = time.split(':');
      const timeObj = new Date();
      timeObj.setHours(parseInt(hours), parseInt(minutes));
      document.getElementById('booking-time').textContent = timeObj.toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
    }
    
    document.getElementById('booking-duration').textContent = `${duration} minutes`;
    
    // Set download link
    if (bookingId) {
      document.getElementById('download-ics-btn').href = `/api/bookings/${bookingId}/ics`;
    }
    
    // Generate Google Calendar link
    if (date && time) {
      const startDate = new Date(`${date}T${time}:00`);
      const endDate = new Date(startDate.getTime() + parseInt(duration) * 60000);
      
      const formatGoogleDate = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
      
      const googleUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('Interview with ' + profileName)}&dates=${formatGoogleDate(startDate)}/${formatGoogleDate(endDate)}&details=${encodeURIComponent('Interview scheduled via OpenInterview.me')}&location=${encodeURIComponent('Video Call')}`;
      
      document.getElementById('google-cal-btn').href = googleUrl;
      
      // Outlook link
      const outlookUrl = `https://outlook.live.com/calendar/0/deeplink/compose?subject=${encodeURIComponent('Interview with ' + profileName)}&startdt=${startDate.toISOString()}&enddt=${endDate.toISOString()}&body=${encodeURIComponent('Interview scheduled via OpenInterview.me')}&location=${encodeURIComponent('Video Call')}`;
      
      document.getElementById('outlook-cal-btn').href = outlookUrl;
    }
  </script>
</body>
</html>
