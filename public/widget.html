<!doctype html>
<html class="light widget-html-embed h-auto min-h-0" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>OpenInterview.me — Resume upload</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            primary: "#141414",
                            "background-light": "#ffffff",
                            "background-dark": "#000000",
                            "foreground-light": "#141414",
                            "foreground-dark": "#f7f7f7",
                            "muted-light": "#737373",
                            "muted-dark": "#a3a3a3",
                        },
                        fontFamily: {
                            display: ["Inter", "sans-serif"],
                        },
                        borderRadius: {
                            DEFAULT: "0.25rem",
                            lg: "0.5rem",
                            xl: "0.75rem",
                            full: "9999px",
                        },
                    },
                },
            };
        </script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
            rel="stylesheet"
        />
        <style>
            html.widget-html-embed,
            html.widget-html-embed body {
                margin: 0;
                min-height: 0;
                height: auto;
            }

            /* Embed: shrink-wrap vertically (no phantom scroll below uploader) */
            html.widget-html-embed body {
                overflow-x: hidden;
            }

            body {
                font-family: "Inter", sans-serif;
            }

            /* Enterprise-level professional animations */
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes bounceSubtle {
                0%,
                20%,
                50%,
                80%,
                100% {
                    transform: translateY(0);
                }
                40% {
                    transform: translateY(-10px);
                }
                60% {
                    transform: translateY(-5px);
                }
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            @keyframes slideInFromLeft {
                from {
                    opacity: 0;
                    transform: translateX(-50px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }

            @keyframes slideInFromRight {
                from {
                    opacity: 0;
                    transform: translateX(50px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }

            @keyframes scaleIn {
                from {
                    opacity: 0;
                    transform: scale(0.8);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            @keyframes iconFloat {
                0%,
                100% {
                    transform: translateY(0px);
                }
                50% {
                    transform: translateY(-8px);
                }
            }

            @keyframes shimmer {
                0% {
                    background-position: -200px 0;
                }
                100% {
                    background-position: calc(200px + 100%) 0;
                }
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.7;
                }
            }

            @keyframes infinite-scroll {
                from {
                    transform: translateX(0);
                }
                to {
                    transform: translateX(-50%);
                }
            }

            .animate-infinite-scroll {
                animation: infinite-scroll 25s linear infinite;
            }

            /* Micro-interaction Animations */
            @keyframes file-float {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-10px);
                }
            }

            /* Resume Upload Animation Keyframes */
            @keyframes resume-drop {
                0% {
                    transform: translateY(-40px) scale(1);
                    opacity: 0;
                }
                10% {
                    transform: translateY(-40px) scale(1);
                    opacity: 1;
                }
                40% {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }
                50% {
                    transform: translateY(10px) scale(0.5);
                    opacity: 0;
                }
                100% {
                    transform: translateY(10px) scale(0.5);
                    opacity: 0;
                }
            }

            @keyframes profile-appear {
                0%,
                45% {
                    transform: scale(0.8);
                    opacity: 0;
                }
                60% {
                    transform: scale(1.05);
                    opacity: 1;
                }
                70% {
                    transform: scale(1);
                    opacity: 1;
                }
                90% {
                    transform: scale(1);
                    opacity: 1;
                }
                100% {
                    transform: scale(1);
                    opacity: 0;
                }
            }

            @keyframes cursor-path {
                0% {
                    transform: translate(30px, -30px);
                    opacity: 0;
                }
                10% {
                    transform: translate(30px, -30px);
                    opacity: 1;
                }
                40% {
                    transform: translate(0, 0);
                    opacity: 1;
                }
                50% {
                    transform: translate(0, 0);
                    opacity: 0;
                }
                100% {
                    transform: translate(0, 0);
                    opacity: 0;
                }
            }

            @keyframes toggle-slide {
                0%,
                100% {
                    transform: translateX(0);
                }
                50% {
                    transform: translateX(14px);
                }
            }

            @keyframes fade-in-out {
                0%,
                100% {
                    opacity: 0;
                    transform: translate(-50%, 10px);
                }
                50% {
                    opacity: 1;
                    transform: translate(-50%, -20px);
                }
            }

            @keyframes cursor-move {
                0% {
                    transform: translate(0, 0);
                }
                40% {
                    transform: translate(40px, 40px);
                }
                50% {
                    transform: translate(40px, 40px) scale(0.9);
                }
                60% {
                    transform: translate(40px, 40px) scale(1);
                }
                100% {
                    transform: translate(0, 0);
                }
            }

            @keyframes button-press {
                0%,
                45% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(0.95);
                }
                55%,
                100% {
                    transform: scale(1);
                }
            }

            .animate-file-float {
                animation: file-float 3s ease-in-out infinite;
            }
            .animate-toggle-slide {
                animation: toggle-slide 3s ease-in-out infinite alternate;
            }
            .animate-cursor-move {
                animation: cursor-move 4s ease-in-out infinite;
            }
            .animate-button-press {
                animation: button-press 4s ease-in-out infinite;
            }

            .animate-fade-in-up {
                animation: fadeInUp 0.8s ease-out forwards;
                opacity: 0;
            }

            .animate-bounce-subtle {
                animation: bounceSubtle 2s infinite;
            }

            .animate-fade-in {
                animation: fadeIn 0.5s ease-out forwards;
            }

            .animate-slide-in-left {
                animation: slideInFromLeft 0.8s ease-out forwards;
                opacity: 0;
            }

            .animate-slide-in-right {
                animation: slideInFromRight 0.8s ease-out forwards;
                opacity: 0;
            }

            .animate-scale-in {
                animation: scaleIn 0.6s ease-out forwards;
                opacity: 0;
            }

            .animate-icon-float {
                animation: iconFloat 3s ease-in-out infinite;
            }

            .animate-pulse-subtle {
                animation: pulse 2s ease-in-out infinite;
            }

            /* Interactive card effects */
            .feature-card {
                position: relative;
                overflow: hidden;
                background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
                border: 1px solid #e9ecef;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .feature-card:hover {
                transform: translateY(-8px) scale(1.02);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
                border-color: #141414;
            }

            .feature-card::before {
                content: "";
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(20, 20, 20, 0.05),
                    transparent
                );
                transition: left 0.6s;
            }

            .feature-card:hover::before {
                left: 100%;
            }

            .feature-card .icon-container {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .feature-card:hover .icon-container {
                transform: scale(1.1) rotate(5deg);
                background: linear-gradient(135deg, #141414, #333333);
            }

            .feature-card:hover .icon-container .material-symbols-outlined {
                color: white;
            }

            .feature-card h2 {
                transition: color 0.3s ease;
            }

            .feature-card:hover h2 {
                color: #141414;
            }

            /* Dark mode adjustments */
            .dark .feature-card {
                background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
                border-color: #404040;
            }

            .dark .feature-card:hover {
                border-color: #ffffff;
                box-shadow: 0 20px 40px rgba(255, 255, 255, 0.1);
            }

            .dark .feature-card::before {
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.05),
                    transparent
                );
            }

            .dark .feature-card:hover .icon-container {
                background: linear-gradient(135deg, #ffffff, #e0e0e0);
            }

            .dark
                .feature-card:hover
                .icon-container
                .material-symbols-outlined {
                color: #141414;
            }

            .dark .feature-card:hover h2 {
                color: #ffffff;
            }

            /* Staggered animation delays */
            .stagger-1 {
                animation-delay: 0.1s;
            }
            .stagger-2 {
                animation-delay: 0.2s;
            }
            .stagger-3 {
                animation-delay: 0.3s;
            }
            .stagger-4 {
                animation-delay: 0.4s;
            }
            .stagger-5 {
                animation-delay: 0.5s;
            }
            .stagger-6 {
                animation-delay: 0.6s;
            }

            /* Enhanced drop zone styles */
            #drop-zone.drag-over {
                border-color: #141414 !important;
                background-color: #f8f9fa !important;
                transform: scale(1.02);
            }

            #bottom-resume-drop-zone.drag-over {
                border-color: rgba(255, 255, 255, 0.8) !important;
                background-color: rgba(255, 255, 255, 0.14) !important;
                transform: scale(1.02);
            }

            /* Professional loading animations */
            @keyframes uploadPulse {
                0%,
                100% {
                    transform: scale(1);
                    opacity: 1;
                }
                50% {
                    transform: scale(1.05);
                    opacity: 0.8;
                }
            }

            @keyframes progressShimmer {
                0% {
                    background-position: -200px 0;
                }
                100% {
                    background-position: calc(200px + 100%) 0;
                }
            }

            @keyframes floatUpDown {
                0%,
                100% {
                    transform: translateY(0px);
                }
                50% {
                    transform: translateY(-6px);
                }
            }

            .upload-processing {
                background: linear-gradient(135deg, #f8f9fa, #e9ecef);
                border: 2px solid #141414;
                animation: uploadPulse 2s ease-in-out infinite;
            }

            /* Dark mode upload processing */
            .dark .upload-processing {
                background: linear-gradient(135deg, #374151, #4b5563);
                border: 2px solid #6b7280;
            }

            .upload-processing .upload-icon {
                animation: floatUpDown 2s ease-in-out infinite;
            }

            .progress-shimmer {
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.4),
                    transparent
                );
                background-size: 200px 100%;
                animation: progressShimmer 1.5s infinite;
            }

            /* Success state */
            .upload-success {
                background: linear-gradient(135deg, #10b981, #059669);
                border: 2px solid #059669;
                color: white;
            }

            /* Ensure all text in success state is readable */
            .upload-success * {
                color: white !important;
            }

            /* Success state text overrides */
            .upload-success .text-green-600,
            .upload-success .text-foreground-light,
            .upload-success .text-foreground-dark,
            .upload-success .text-muted-light,
            .upload-success .text-muted-dark {
                color: white !important;
            }

            /* Success state progress container styling */
            .upload-success #upload-progress {
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }

            .upload-success #upload-progress * {
                color: white !important;
            }

            /* Error state */
            .upload-error {
                background: linear-gradient(135deg, #ef4444, #dc2626);
                border: 2px solid #dc2626;
                color: white;
            }

            /* Disabled state for buttons */
            .btn-disabled {
                opacity: 0.5;
                cursor: not-allowed !important;
                pointer-events: none;
            }
        </style>
        <link rel="icon" type="image/png" href="/favicon.png" />
    </head>
    <body
        class="bg-background-light dark:bg-background-dark text-primary dark:text-background-light font-display min-h-0"
    >
        <div class="relative flex w-full flex-col shrink-0">
            <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-[9999] focus:px-4 focus:py-2 focus:bg-primary focus:text-white focus:rounded-lg focus:shadow-lg focus:outline-none">Skip to main content</a>
            <div class="layout-container flex flex-col shrink-0">
                <div class="mx-auto w-full max-w-5xl px-3 pb-4 pt-2 sm:px-4 lg:px-6 shrink-0">
                    <div class="layout-content-container flex flex-col shrink-0">
                        <main
                            id="main-content"
                            class="relative z-10 flex shrink-0 flex-col gap-0 py-3"
                        >
                            <!-- Background Gradient/Spotlight (short — huge h-[800px] caused empty iframe scroll) -->
                            <div
                                class="pointer-events-none absolute left-1/2 top-0 z-0 h-[200px] w-full max-w-3xl -translate-x-1/2 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-primary/5 via-transparent to-transparent opacity-70 dark:from-white/5"
                                aria-hidden="true"
                            ></div>
                            <section
                                id="resume-upload-section"
                                class="relative z-10 flex shrink-0 flex-col items-center gap-0 px-1 pb-4 pt-2 text-center"
                                aria-label="Resume upload"
                            >
                                <div class="widget-upload-wrap w-full max-w-2xl shrink-0 px-0 py-0">
                                    <form
                                        id="resume-upload-form"
                                        enctype="multipart/form-data"
                                    >
                                        <div
                                            id="drop-zone"
                                            class="flex flex-col items-center gap-6 rounded-none border-2 border-dashed border-neutral-300 dark:border-neutral-700 p-8 md:p-14 cursor-pointer hover:border-neutral-400 dark:hover:border-neutral-600 transition-all duration-300 hover:scale-[1.02] hover:shadow-lg"
                                        >
                                            <div
                                                class="flex max-w-[480px] flex-col items-center gap-2"
                                            >
                                                <div
                                                    class="relative w-28 h-28 mb-4 flex items-center justify-center pointer-events-none select-none"
                                                >
                                                    <!-- Base Circle/Background -->
                                                    <div
                                                        class="absolute inset-0 bg-primary/5 dark:bg-white/5 rounded-full flex items-center justify-center border border-primary/10 dark:border-white/10"
                                                    ></div>

                                                    <!-- Profile Card (Result) -->
                                                    <div
                                                        class="absolute z-20 w-16 h-20 bg-white dark:bg-neutral-800 rounded-lg shadow-lg border border-neutral-100 dark:border-neutral-700 flex flex-col items-center p-2"
                                                        style="
                                                            animation: profile-appear
                                                                4s ease-in-out
                                                                infinite;
                                                        "
                                                    >
                                                        <div
                                                            class="w-6 h-6 bg-primary dark:bg-white rounded-full mb-2 flex items-center justify-center"
                                                        >
                                                            <span
                                                                class="material-symbols-outlined text-[10px] text-white dark:text-primary font-bold"
                                                                >person</span
                                                            >
                                                        </div>
                                                        <div
                                                            class="w-10 h-1 bg-neutral-200 dark:bg-neutral-600 rounded-full mb-1"
                                                        ></div>
                                                        <div
                                                            class="w-8 h-1 bg-neutral-200 dark:bg-neutral-600 rounded-full"
                                                        ></div>
                                                        <div
                                                            class="absolute -top-1 -right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-white dark:border-neutral-800 flex items-center justify-center"
                                                        >
                                                            <span
                                                                class="material-symbols-outlined text-[10px] text-white font-bold"
                                                                >check</span
                                                            >
                                                        </div>
                                                    </div>

                                                    <!-- Resume File (Input) -->
                                                    <div
                                                        class="absolute z-10 w-12 h-16 bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 shadow-md rounded flex flex-col items-center p-1.5"
                                                        style="
                                                            animation: resume-drop
                                                                4s ease-in-out
                                                                infinite;
                                                        "
                                                    >
                                                        <div
                                                            class="w-full h-1 bg-primary/20 dark:bg-white/20 mb-1 rounded-full"
                                                        ></div>
                                                        <div
                                                            class="w-full h-0.5 bg-neutral-100 dark:bg-neutral-700 mb-0.5 rounded-full"
                                                        ></div>
                                                        <div
                                                            class="w-full h-0.5 bg-neutral-100 dark:bg-neutral-700 mb-0.5 rounded-full"
                                                        ></div>
                                                        <div
                                                            class="w-3/4 h-0.5 bg-neutral-100 dark:bg-neutral-700 mb-0.5 rounded-full"
                                                        ></div>
                                                        <div
                                                            class="mt-auto w-4 h-4 flex items-center justify-center bg-primary/5 dark:bg-white/5 rounded-full"
                                                        >
                                                            <span
                                                                class="material-symbols-outlined text-[10px] text-primary dark:text-white"
                                                                >description</span
                                                            >
                                                        </div>
                                                    </div>

                                                    <!-- Cursor -->
                                                    <div
                                                        class="absolute z-30 ml-8 mt-8"
                                                        style="
                                                            animation: cursor-path
                                                                4s ease-in-out
                                                                infinite;
                                                        "
                                                    >
                                                        <svg
                                                            class="w-6 h-6 fill-neutral-900 dark:fill-white stroke-white dark:stroke-neutral-900 stroke-2 drop-shadow-md"
                                                            viewBox="0 0 24 24"
                                                        >
                                                            <path
                                                                d="M5.65376 12.3673H5.46026L5.31717 12.4976L0.500002 16.8829L0.500002 1.19841L11.7841 12.3673H5.65376Z"
                                                            />
                                                        </svg>
                                                    </div>
                                                </div>
                                                <p
                                                    class="text-lg font-bold leading-tight tracking-[-0.015em]"
                                                >
                                                    Drag &amp; drop your resume
                                                    here
                                                </p>
                                                <p
                                                    class="text-sm font-normal leading-normal text-neutral-600 dark:text-neutral-400"
                                                >
                                                    or
                                                </p>
                                            </div>
                                            <input
                                                type="file"
                                                id="resume-file-input"
                                                name="file"
                                                accept=".pdf,.doc,.docx,.txt,.rtf"
                                                class="hidden"
                                            />
                                            <button
                                                type="button"
                                                id="browse-files-btn"
                                                class="flex h-12 min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden bg-primary px-6 text-sm font-bold leading-normal tracking-[0.015em] text-background-light transition-all duration-300 hover:opacity-80 hover:scale-105 dark:bg-background-light dark:text-background-dark rounded-lg"
                                            >
                                                <span class="truncate"
                                                    >Browse Files</span
                                                >
                                            </button>
                                            <p
                                                id="file-name"
                                                class="text-sm text-neutral-600 dark:text-neutral-400 hidden animate-fade-in"
                                            ></p>
                                            <div
                                                id="upload-progress"
                                                class="w-full max-w-[480px] hidden"
                                            >
                                                <!-- Professional Upload Progress Container -->
                                                <div
                                                    class="bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-lg p-6 shadow-lg"
                                                >
                                                    <!-- Header with animated icon -->
                                                    <div
                                                        class="flex items-center gap-4 mb-4"
                                                    >
                                                        <div class="relative">
                                                            <div
                                                                class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center upload-icon"
                                                            >
                                                                <span
                                                                    class="material-symbols-outlined text-2xl text-primary"
                                                                    >cloud_upload</span
                                                                >
                                                            </div>
                                                            <!-- Spinning border overlay -->
                                                            <div
                                                                class="absolute inset-0 w-12 h-12 border-2 border-transparent border-t-primary rounded-full animate-spin"
                                                            ></div>
                                                        </div>
                                                        <div class="flex-1">
                                                            <h3
                                                                class="font-semibold text-lg text-foreground-light dark:text-foreground-dark"
                                                            >
                                                                Processing
                                                                Resume
                                                            </h3>
                                                            <p
                                                                id="upload-status"
                                                                class="text-sm text-muted-light dark:text-muted-dark"
                                                            ></p>
                                                        </div>
                                                    </div>

                                                    <!-- Progress Section -->
                                                    <div class="space-y-3">
                                                        <!-- Progress Bar -->
                                                        <div
                                                            class="relative w-full bg-neutral-200 dark:bg-neutral-700 rounded-full h-3 overflow-hidden"
                                                        >
                                                            <div
                                                                id="progress-bar"
                                                                class="bg-gradient-to-r from-primary to-neutral-600 h-3 rounded-full transition-all duration-500 ease-out relative overflow-hidden"
                                                                style="
                                                                    width: 0%;
                                                                "
                                                            >
                                                                <!-- Shimmer effect -->
                                                                <div
                                                                    class="absolute inset-0 progress-shimmer"
                                                                ></div>
                                                            </div>
                                                        </div>

                                                        <!-- Progress Details -->
                                                        <div
                                                            class="flex justify-between items-center text-sm"
                                                        >
                                                            <span
                                                                id="progress-text"
                                                                class="text-muted-light dark:text-muted-dark"
                                                                >Initializing...</span
                                                            >
                                                            <span
                                                                id="progress-percentage"
                                                                class="font-medium text-foreground-light dark:text-foreground-dark"
                                                                >0%</span
                                                            >
                                                        </div>

                                                        <!-- File Info -->
                                                        <div
                                                            class="flex items-center gap-2 pt-2 border-t border-neutral-200 dark:border-neutral-700"
                                                        >
                                                            <span
                                                                class="material-symbols-outlined text-lg text-muted-light dark:text-muted-dark"
                                                                >description</span
                                                            >
                                                            <span
                                                                id="file-info"
                                                                class="text-sm text-muted-light dark:text-muted-dark"
                                                            ></span>
                                                        </div>

                                                        <!-- Processing Steps -->
                                                        <div
                                                            id="processing-steps"
                                                            class="space-y-2 pt-2"
                                                        >
                                                            <div
                                                                class="flex items-center gap-2 text-xs text-muted-light dark:text-muted-dark"
                                                            >
                                                                <div
                                                                    class="w-2 h-2 bg-primary rounded-full animate-pulse"
                                                                ></div>
                                                                <span
                                                                    >Uploading
                                                                    to secure
                                                                    cloud
                                                                    storage...</span
                                                                >
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
