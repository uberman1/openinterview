<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Subscription Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
  </style>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#141414",
            "background-light": "#f7f7f7",
            "background-dark": "#191919",
          },
          fontFamily: {
            "display": ["Inter"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
  <!-- Global Loader -->
  <div id="global-loader" class="fixed inset-0 z-50 flex items-center justify-center bg-white/80 dark:bg-[#191919]/80 backdrop-blur-sm transition-opacity duration-500">
    <div class="h-12 w-12 animate-spin rounded-full border-4 border-primary border-t-transparent dark:border-white dark:border-t-transparent"></div>
  </div>

<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden text-primary">
<div class="flex h-full grow flex-col">
<app-navbar></app-navbar>
<main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8">
<div class="max-w-2xl mx-auto py-12 sm:py-16 lg:py-24">
<div class="mb-12">
<h2 class="text-3xl font-bold tracking-tight text-primary dark:text-white sm:text-4xl">Subscription</h2>
<p class="mt-2 text-base text-primary/60 dark:text-white/60">Manage your billing and subscription details.</p>
</div>
<div class="space-y-8" id="subscription-content">
<!-- Content will be loaded by JavaScript -->
</div>
</div>
</main>
</div>

<script src="/js/components/navbar.js"></script>
<script src="/js/header.avatar.bind.js"></script>
<script src="/js/subscription.bind.js"></script>
<script src="/js/payment-toast.js"></script>
</body></html>
