<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Payment Successful - OpenInterview.me</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#141414",
            "background-light": "#f7f7f7",
            "background-dark": "#191919",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          }
        },
      },
    }
  </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-primary dark:text-neutral-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md text-center">
    <!-- Success Icon -->
    <div class="w-20 h-20 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center mx-auto mb-6">
      <span class="material-symbols-outlined text-5xl text-green-600">check_circle</span>
    </div>
    
    <!-- Title -->
    <h1 class="text-3xl font-bold mb-4">Payment Successful!</h1>
    
    <!-- Description -->
    <p class="text-neutral-600 dark:text-neutral-400 mb-8">
      Your plan has been upgraded. You can now share more profiles and accept interview bookings.
    </p>
    
    <!-- Plan Details (will be populated by JS) -->
    <div id="plan-details" class="bg-white dark:bg-neutral-800 rounded-lg p-6 mb-8 border border-neutral-200 dark:border-neutral-700">
      <div class="flex items-center justify-between mb-4">
        <span class="text-neutral-600 dark:text-neutral-400">Plan</span>
        <span id="plan-name" class="font-bold">Loading...</span>
      </div>
      <div class="flex items-center justify-between mb-4">
        <span class="text-neutral-600 dark:text-neutral-400">Profile Shares</span>
        <span id="shares-limit" class="font-bold">-</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-neutral-600 dark:text-neutral-400">Interview Bookings</span>
        <span id="bookings-limit" class="font-bold">-</span>
      </div>
    </div>
    
    <!-- CTA Button -->
    <a href="/home.html" 
      class="inline-flex items-center justify-center h-12 px-8 bg-primary text-white font-bold rounded-lg hover:opacity-90 transition-opacity">
      Go to Dashboard
    </a>
    
    <!-- Secondary Link -->
    <p class="mt-6">
      <a href="/profiles" class="text-neutral-500 hover:text-primary dark:hover:text-white text-sm">
        View My Profiles →
      </a>
    </p>
  </div>
  
  <script>
    // Fetch current usage to show updated limits
    async function loadPlanDetails() {
      try {
        const response = await fetch('/api/usage', {
          credentials: 'include'
        });
        
        if (response.ok) {
          const data = await response.json();
          
          document.getElementById('plan-name').textContent = 
            data.plan.charAt(0).toUpperCase() + data.plan.slice(1) + ' Plan';
          
          document.getElementById('shares-limit').textContent = 
            data.shares.limit >= 999999 ? 'Unlimited' : data.shares.limit;
          
          document.getElementById('bookings-limit').textContent = 
            data.bookings.limit >= 999999 ? 'Unlimited' : data.bookings.limit;
        }
      } catch (error) {
        console.error('Failed to load plan details:', error);
      }
    }
    
    loadPlanDetails();
  </script>
</body>
</html>
