<!DOCTYPE html>
<html class="light" lang="en">
<head>

  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Help Center — OpenInterview</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#141414',
            'background-light': '#ffffff',
            'background-dark': '#000000',
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 1.125rem;
      vertical-align: middle;
      line-height: 1;
    }
    #help-main section.help-search-hit {
      scroll-margin-top: 6rem;
      border-radius: 0.375rem;
      border-left: 3px solid #141414;
      padding-left: 0.75rem;
      margin-left: -0.125rem;
      background: rgba(245, 245, 245, 0.85);
      box-shadow: 0 1px 0 0 rgba(0, 0, 0, 0.06);
    }
    .dark #help-main section.help-search-hit {
      border-left-color: #fafafa;
      background: rgba(38, 38, 38, 0.65);
      box-shadow: 0 1px 0 0 rgba(255, 255, 255, 0.06);
    }
    #help-ai-thread::-webkit-scrollbar {
      width: 8px;
    }
    #help-ai-thread::-webkit-scrollbar-track {
      background: transparent;
    }
    #help-ai-thread::-webkit-scrollbar-thumb {
      border-radius: 9999px;
      background: rgba(115, 115, 115, 0.35);
    }
    .dark #help-ai-thread::-webkit-scrollbar-thumb {
      background: rgba(163, 163, 163, 0.35);
    }
    @keyframes help-ai-cursor-blink {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: 0.15; }
    }
    .help-ai-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 1px;
      vertical-align: text-bottom;
      background: currentColor;
      animation: help-ai-cursor-blink 1s step-end infinite;
    }

    /* Ask AI — attention CTA beside search */
    @keyframes help-ask-ai-shimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes help-ask-ai-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.45), 0 4px 20px -6px rgba(20, 20, 20, 0.45); }
      55% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0), 0 8px 28px -8px rgba(20, 20, 20, 0.55); }
    }
    @keyframes help-ask-ai-icon-nudge {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-1px) rotate(-4deg); }
      75% { transform: translateY(1px) rotate(4deg); }
    }
    .help-ask-ai-wrap {
      position: relative;
      display: inline-flex;
      border-radius: 0.875rem;
      padding: 2px;
      background: linear-gradient(120deg, #1f1f1f 0%, #6366f1 35%, #141414 55%, #a855f7 80%, #1f1f1f 100%);
      background-size: 220% 220%;
      animation: help-ask-ai-shimmer 5s ease-in-out infinite, help-ask-ai-pulse 2.8s ease-in-out infinite;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .help-ask-ai-wrap:hover {
      transform: translateY(-2px) scale(1.02);
      animation-play-state: paused, paused;
    }
    .help-ask-ai-wrap:active {
      transform: translateY(0) scale(0.98);
    }
    .help-ask-ai-btn {
      position: relative;
      overflow: hidden;
      border-radius: 0.75rem;
      background: linear-gradient(180deg, #1f1f1f 0%, #141414 100%);
      color: #fafafa;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: box-shadow 0.2s ease, background 0.2s ease;
    }
    .dark .help-ask-ai-btn {
      background: linear-gradient(180deg, #262626 0%, #171717 100%);
    }
    .help-ask-ai-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.14) 50%, transparent 60%);
      transform: translateX(-120%);
      transition: transform 0.65s ease;
    }
    .help-ask-ai-wrap:hover .help-ask-ai-btn::after {
      transform: translateX(120%);
    }
    .help-ask-ai-icon {
      display: inline-flex;
      animation: help-ask-ai-icon-nudge 3.5s ease-in-out infinite;
    }
    .help-ask-ai-wrap:hover .help-ask-ai-icon {
      animation-play-state: paused;
    }
    .help-ask-ai-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      background: rgba(99, 102, 241, 0.25);
      color: #c7d2fe;
      border: 1px solid rgba(129, 140, 248, 0.35);
    }
    .dark .help-ask-ai-badge {
      background: rgba(99, 102, 241, 0.2);
      color: #e0e7ff;
    }

    /* Modal open / close */
    .help-ai-modal-root {
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }
    .help-ai-modal-root:not(.help-ai-modal--open) {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .help-ai-modal-root.help-ai-modal--open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .help-ai-backdrop {
      transition: opacity 0.32s ease;
    }
    .help-ai-modal-root:not(.help-ai-modal--open) .help-ai-backdrop {
      opacity: 0;
    }
    .help-ai-modal-root.help-ai-modal--open .help-ai-backdrop {
      opacity: 1;
    }
    .help-ai-dialog-panel {
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s ease;
    }
    .help-ai-modal-root:not(.help-ai-modal--fab):not(.help-ai-modal--open) .help-ai-dialog-panel {
      transform: translateY(1.25rem) scale(0.96);
      opacity: 0;
    }
    .help-ai-modal-root:not(.help-ai-modal--fab).help-ai-modal--open .help-ai-dialog-panel {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    /* Markdown body (marked + DOMPurify) */
    .help-ai-md :first-child { margin-top: 0; }
    .help-ai-md :last-child { margin-bottom: 0; }
    .help-ai-md p { margin: 0.45em 0; }
    .help-ai-md h1 { font-size: 1.125rem; font-weight: 800; margin: 0.75em 0 0.35em; letter-spacing: -0.02em; }
    .help-ai-md h2 { font-size: 1.05rem; font-weight: 700; margin: 0.7em 0 0.3em; }
    .help-ai-md h3, .help-ai-md h4 { font-size: 1rem; font-weight: 700; margin: 0.65em 0 0.25em; }
    .help-ai-md ul, .help-ai-md ol { margin: 0.4em 0; padding-left: 1.35rem; }
    .help-ai-md ul { list-style: disc; }
    .help-ai-md ol { list-style: decimal; }
    .help-ai-md li { margin: 0.2em 0; }
    .help-ai-md strong { font-weight: 600; }
    .help-ai-md blockquote { border-left: 3px solid #d4d4d4; margin: 0.5em 0; padding-left: 0.75rem; color: #525252; }
    .dark .help-ai-md blockquote { border-left-color: #525252; color: #a3a3a3; }
    .help-ai-md code { font-size: 0.88em; background: rgba(0,0,0,0.06); padding: 0.12em 0.4em; border-radius: 0.25rem; font-family: ui-monospace, monospace; }
    .dark .help-ai-md code { background: rgba(255,255,255,0.1); }
    .help-ai-md pre { margin: 0.5em 0; padding: 0.75rem; border-radius: 0.5rem; background: rgba(0,0,0,0.06); overflow-x: auto; font-size: 0.88em; }
    .dark .help-ai-md pre { background: rgba(255,255,255,0.08); }
    .help-ai-md pre code { background: none; padding: 0; }
    .help-ai-md a { color: #2563eb; text-decoration: underline; text-underline-offset: 2px; }
    .dark .help-ai-md a { color: #93c5fd; }
    .help-ai-md hr { margin: 0.75em 0; border: 0; border-top: 1px solid #e5e5e5; }
    .dark .help-ai-md hr { border-top-color: #404040; }
    .help-ai-md table { width: 100%; font-size: 0.92em; border-collapse: collapse; margin: 0.5em 0; }
    .help-ai-md th, .help-ai-md td { border: 1px solid #e5e5e5; padding: 0.35rem 0.5rem; text-align: left; }
    .dark .help-ai-md th, .dark .help-ai-md td { border-color: #404040; }

    @media (prefers-reduced-motion: reduce) {
      .help-ask-ai-wrap,
      .help-ask-ai-icon {
        animation: none !important;
      }
      .help-ask-ai-wrap:hover {
        transform: none;
      }
      .help-ai-dialog-panel,
      .help-ai-backdrop,
      .help-ai-modal-root {
        transition-duration: 0.01ms !important;
      }
    }

    .help-ai-thread-area {
      background:
        radial-gradient(ellipse 85% 55% at 50% -5%, rgba(99, 102, 241, 0.07), transparent 55%),
        rgba(250, 250, 250, 0.65);
    }
    .dark .help-ai-thread-area {
      background:
        radial-gradient(ellipse 85% 55% at 50% -5%, rgba(99, 102, 241, 0.12), transparent 55%),
        rgba(10, 10, 10, 0.5);
    }

    /* Help doc screenshots (inline in section flow) */
    .help-doc-section .help-doc-shot-img {
      display: block;
      max-height: min(52vh, 520px);
      width: 100%;
      height: auto;
      margin: 0 auto;
    }
    @media (min-width: 1024px) {
      .help-doc-section .help-doc-shots {
        padding-top: 0.25rem;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-background-light text-neutral-900 dark:bg-background-dark dark:text-neutral-100">
  <div id="help-root" class="mx-auto flex min-h-screen max-w-7xl flex-col">
    <header class="flex flex-col gap-3 border-b border-neutral-200 px-4 py-4 dark:border-neutral-800 sm:flex-row sm:items-center sm:justify-between sm:px-6">
      <div class="min-w-0">
        <a href="/home.html" class="text-sm font-semibold text-primary dark:text-white">OpenInterview</a>
        <span class="text-neutral-400"> / Help</span>
      </div>
      <div class="flex w-full flex-wrap items-center gap-2 sm:w-auto sm:justify-end sm:gap-3">
        <label class="sr-only" for="help-search-input">Search this page</label>
        <div class="relative flex min-w-0 flex-1 items-center gap-1 sm:max-w-md sm:flex-initial">
          <div class="relative min-w-0 flex-1">
            <span class="material-symbols-outlined pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-neutral-400" aria-hidden="true">search</span>
            <input id="help-search-input" type="search" autocomplete="off" placeholder="Search this page" class="w-full rounded-lg border border-neutral-200 bg-white py-2 pl-9 pr-3 text-sm text-neutral-900 placeholder:text-neutral-400 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-100 dark:placeholder:text-neutral-500"/>
          </div>
          <div class="flex shrink-0 items-center rounded-lg border border-neutral-200 bg-neutral-50 dark:border-neutral-700 dark:bg-neutral-900" role="group" aria-label="Jump between matches">
            <button type="button" id="help-search-prev" disabled class="rounded-l-lg p-2 text-neutral-500 hover:bg-neutral-100 hover:text-primary disabled:pointer-events-none disabled:opacity-30 dark:hover:bg-neutral-800 dark:hover:text-white" title="Previous match" aria-label="Previous match">
              <span class="material-symbols-outlined text-[1.15rem]" aria-hidden="true">keyboard_arrow_up</span>
            </button>
            <button type="button" id="help-search-next" disabled class="rounded-r-lg border-l border-neutral-200 p-2 text-neutral-500 hover:bg-neutral-100 hover:text-primary disabled:pointer-events-none disabled:opacity-30 dark:border-neutral-700 dark:hover:bg-neutral-800 dark:hover:text-white" title="Next match" aria-label="Next match">
              <span class="material-symbols-outlined text-[1.15rem]" aria-hidden="true">keyboard_arrow_down</span>
            </button>
          </div>
        </div>
        <span class="help-ask-ai-wrap shrink-0">
          <button type="button" id="help-ask-ai-btn" class="help-ask-ai-btn inline-flex shrink-0 items-center gap-2 px-4 py-2.5 text-sm font-semibold tracking-tight">
            <span class="help-ask-ai-icon material-symbols-outlined text-[1.25rem]" aria-hidden="true">auto_awesome</span>
            <span class="help-ask-ai-label">Ask AI</span>
            <span class="help-ask-ai-badge">AI</span>
          </button>
        </span>
        <p id="help-search-hint" class="hidden w-full basis-full text-right text-xs text-neutral-600 dark:text-neutral-400" role="status" aria-live="polite"></p>
      </div>
    </header>
    <div class="grid flex-1 grid-cols-1 gap-0 lg:grid-cols-[minmax(200px,240px)_minmax(0,1fr)_minmax(160px,200px)]">
      <aside class="border-b border-neutral-200 p-4 dark:border-neutral-800 lg:border-b-0 lg:border-r">
        <nav id="help-nav" class="sticky top-4 space-y-1 text-sm" aria-label="Help pages"></nav>
      </aside>
      <main id="help-main" class="min-w-0 border-b border-neutral-200 px-4 py-8 dark:border-neutral-800 lg:border-b-0 lg:px-8">
        <p class="text-neutral-500">Loading…</p>
      </main>
      <aside class="p-4 lg:border-l lg:border-neutral-200 dark:lg:border-neutral-800">
        <nav id="help-toc" class="sticky top-4 hidden text-sm lg:block" aria-label="On this page"></nav>
      </aside>
    </div>
    <footer class="mt-auto border-t border-neutral-200 px-4 py-6 text-center text-sm text-neutral-600 dark:border-neutral-800 dark:text-neutral-400">
      <a href="mailto:support@openinterview.me" class="text-primary underline dark:text-white">support@openinterview.me</a>
    </footer>
  </div>

  <div id="help-ai-modal" class="help-ai-modal-root fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6" aria-hidden="true">
    <div id="help-ai-backdrop" class="help-ai-backdrop absolute inset-0 bg-black/55 backdrop-blur-[3px]" aria-hidden="true"></div>
    <div class="relative z-[1] flex w-full max-w-2xl justify-center">
      <div id="help-ai-dialog-panel" role="dialog" aria-labelledby="help-ai-title" aria-describedby="help-ai-subtitle" aria-modal="true" class="help-ai-dialog-panel flex max-h-[min(92vh,720px)] w-full flex-col overflow-hidden rounded-2xl border border-neutral-200/90 bg-background-light shadow-[0_25px_50px_-12px_rgba(0,0,0,0.35)] ring-1 ring-black/[0.06] dark:border-neutral-700 dark:bg-neutral-950 dark:shadow-[0_25px_60px_-12px_rgba(0,0,0,0.65)] dark:ring-white/10">
        <div class="border-b border-neutral-200 bg-gradient-to-b from-neutral-50 to-neutral-50/30 px-4 py-3.5 dark:border-neutral-800 dark:from-neutral-900/80 dark:to-neutral-950/30 sm:px-5">
          <div class="flex items-start justify-between gap-3">
            <div class="flex min-w-0 gap-3">
              <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-primary to-neutral-800 text-white shadow-md ring-2 ring-white/10 dark:from-neutral-100 dark:to-neutral-300 dark:text-primary dark:ring-black/10">
                <span class="material-symbols-outlined text-[24px]" aria-hidden="true">smart_toy</span>
              </div>
              <div class="min-w-0 pt-0.5">
                <h2 id="help-ai-title" class="text-base font-bold tracking-tight text-primary dark:text-white">Help assistant</h2>
                <p id="help-ai-subtitle" class="mt-0.5 text-xs leading-snug text-neutral-500 dark:text-neutral-400">Grounded in the OpenInterview handbook. Not legal advice.</p>
              </div>
            </div>
            <button type="button" id="help-ai-close" class="shrink-0 rounded-xl p-2 text-neutral-500 transition-colors hover:bg-neutral-200/90 hover:text-neutral-900 dark:hover:bg-neutral-800 dark:hover:text-white" aria-label="Close">
              <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
          </div>
        </div>
        <div id="help-ai-thread-wrap" class="help-ai-thread-area relative flex min-h-[220px] flex-1 flex-col">
          <div id="help-ai-empty" class="flex flex-1 flex-col items-center justify-center gap-3 px-6 py-12 text-center">
            <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-neutral-100 dark:bg-neutral-800/80">
              <span class="material-symbols-outlined text-3xl text-neutral-400 dark:text-neutral-500" aria-hidden="true">forum</span>
            </div>
            <p class="max-w-sm text-sm leading-relaxed text-neutral-500 dark:text-neutral-400">Ask anything about OpenInterview. Answers appear here and follow the published help handbook.</p>
          </div>
          <div id="help-ai-thread" class="hidden max-h-[min(48vh,420px)] min-h-[140px] space-y-4 overflow-y-auto px-4 py-4 text-sm sm:px-5"></div>
        </div>
        <p id="help-ai-error" class="hidden border-t border-red-200 bg-red-50 px-4 py-2.5 text-sm text-red-800 dark:border-red-900/50 dark:bg-red-950/40 dark:text-red-300"></p>
        <form id="help-ai-form" class="border-t border-neutral-200 bg-gradient-to-t from-neutral-50/50 to-background-light p-4 dark:border-neutral-800 dark:from-neutral-950 dark:to-neutral-950 sm:p-5">
          <label class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-neutral-500 dark:text-neutral-400" for="help-ai-input">Your question</label>
          <textarea id="help-ai-input" rows="3" placeholder="e.g. How do I share my interview link?" class="mb-3 w-full resize-y rounded-xl border border-neutral-200 bg-white px-3.5 py-3 text-sm leading-relaxed text-neutral-900 shadow-sm placeholder:text-neutral-400 transition-shadow focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/15 dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-100"></textarea>
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <p class="text-[11px] leading-snug text-neutral-400 dark:text-neutral-500">Enter to send · Shift+Enter for newline</p>
            <div class="flex justify-end gap-2">
              <button type="button" id="help-ai-cancel" class="rounded-xl border border-neutral-200 bg-white px-4 py-2 text-sm font-medium text-neutral-700 shadow-sm transition-colors hover:bg-neutral-50 dark:border-neutral-600 dark:bg-neutral-900 dark:text-neutral-200 dark:hover:bg-neutral-800">Cancel</button>
              <button type="submit" id="help-ai-send" class="inline-flex min-w-[5.75rem] items-center justify-center rounded-xl bg-primary px-4 py-2 text-sm font-semibold text-white shadow-md transition hover:opacity-95 active:scale-[0.98] disabled:pointer-events-none disabled:opacity-45">
                <span id="help-ai-send-label">Send</span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="/js/help-center/app.js"></script>
</body>
</html>
