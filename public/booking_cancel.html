<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Cancel Booking - OpenInterview.me</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#141414",
                        "background-light": "#f7f7f7",
                        "background-dark": "#191919",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .spinner { border: 4px solid rgba(20, 20, 20, 0.1); border-left-color: #141414; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .dark .spinner { border-color: rgba(255, 255, 255, 0.1); border-left-color: #ffffff; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-primary dark:text-neutral-50 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-white dark:bg-neutral-800 rounded-lg shadow-lg p-8 fade-in text-center">
        <h1 class="text-2xl font-bold mb-6 text-primary dark:text-white">Cancel Booking</h1>
        
        <div id="loading-state" class="flex flex-col items-center justify-center py-8">
            <div class="spinner mb-4"></div>
            <p class="text-neutral-600 dark:text-neutral-400">Processing cancellation...</p>
        </div>

        <div id="success-state" class="hidden flex-col items-center">
            <div class="w-16 h-16 bg-neutral-100 dark:bg-neutral-700 text-primary dark:text-white rounded-full flex items-center justify-center mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-xl font-semibold mb-2 text-primary dark:text-white">Booking Cancelled</h2>
            <p id="booking-details" class="text-neutral-600 dark:text-neutral-400 mb-6"></p>
            <a href="/" class="w-full h-12 flex items-center justify-center bg-primary text-white font-bold rounded-lg hover:opacity-90 transition-opacity">Return Home</a>
        </div>

        <div id="error-state" class="hidden flex-col items-center">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </div>
            <h2 class="text-xl font-semibold mb-2 text-primary dark:text-white">Cancellation Failed</h2>
            <p id="error-message" class="text-neutral-600 dark:text-neutral-400 mb-6">Could not process your request.</p>
            <a href="/" class="text-neutral-500 hover:text-primary dark:hover:text-white text-sm">Return Home</a>
        </div>
    </div>
    <script src="/js/booking_cancel.bind.js"></script>
</body>
</html>
