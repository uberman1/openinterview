<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OpenInterview.me - Profiles</title>
<link rel="stylesheet" href="/css/tailwind.css"/>
<style>
        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 0.25rem;
            border: 2px solid #E5E5E5;
            background-color: transparent;
            cursor: pointer;
            position: relative;
            outline: none;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .dark .custom-checkbox {
            border-color: #2A2A2A;
        }
        .custom-checkbox:checked {
            background-color: #141414;
            border-color: #141414;
        }
        .dark .custom-checkbox:checked {
            background-color: #141414;
            border-color: #141414;
        }
        .custom-checkbox:checked::after {
            content: '✓';
            color: #f7f7f7;
            font-size: 1rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .dark .custom-checkbox:checked::after {
            color: #f7f7f7;
        }

        /* Skeleton Loading Animation - Custom Implementation */
        .skeleton-pulse {
            background-color: #e5e7eb;
            animation: skeleton-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .dark .skeleton-pulse {
            background-color: #374151;
        }
        
        @keyframes skeleton-pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* Ensure skeleton elements have proper display */
        .skeleton-pulse {
            display: block !important;
            min-height: 1rem;
            border-radius: 0.25rem;
        }

        /* Button Loading States */
        .btn-loading {
            position: relative;
            color: transparent !important;
            pointer-events: none;
        }
        .btn-loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            margin: -6px 0 0 -6px;
            border: 2px solid currentColor;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Show skeleton initially, hide when loaded */
        .profiles-table tbody {
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .profiles-table tbody.loaded {
            opacity: 1;
        }
        
        /* Hide skeleton elements when data is loaded */
        .profiles-table tbody.loaded .skeleton-pulse {
            display: none;
        }

        /* Loading spinner animation */
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Disabled checkbox styling */
        .custom-checkbox:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Checkbox hover effect */
        .custom-checkbox:not(:disabled):hover {
            border-color: #141414;
            transform: scale(1.05);
            transition: all 0.2s ease;
        }
        .dark .custom-checkbox:not(:disabled):hover {
            border-color: #141414;
        }

        /* Row loading state */
        .row-loading {
            background-color: rgba(59, 130, 246, 0.05);
            transition: background-color 0.2s ease;
        }
        .dark .row-loading {
            background-color: rgba(59, 130, 246, 0.1);
        }

        /* Tooltip for default checkbox */
        .default-checkbox-container {
            position: relative;
        }
        .default-checkbox-container:hover::after {
            content: 'Click to set as default';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1f2937;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 10;
            margin-bottom: 4px;
        }
        .dark .default-checkbox-container:hover::after {
            background-color: #374151;
        }
    </style>
</head>
